<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lanka AI Design Agent - Free Canvas Engine</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col justify-between">

<header class="bg-slate-900 text-white py-6 shadow-md">
<div class="max-w-5xl mx-auto px-4 text-center">
<h1 class="text-3xl font-bold tracking-tight text-amber-400">Lanka AI Design Agent</h1>
<p class="text-slate-400 mt-2 text-sm md:text-base">ලංකාවේ බිස්නස් වලට විනාඩියෙන් Marketing Posts සාදන නොමිලේ වැඩකරන පද්ධතිය</p>
</div>
</header>

<main class="max-w-5xl mx-auto px-4 py-8 w-full flex-grow grid grid-cols-1 md:grid-cols-2 gap-8">

<div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between">
<div class="space-y-6">
<div>
<label class="block text-sm font-semibold text-gray-700 mb-3">1. ඔබේ බිස්නස් වර්ගය තෝරන්න (Category):</label>
<div class="grid grid-cols-2 gap-3">
<button id="cat-clothing" onclick="changeCategory('clothing')" class="p-4 border-2 border-emerald-500 bg-emerald-50 rounded-xl text-left transition text-gray-800 font-medium text-sm">
<span class="block text-xl">👕</span> Clothing Business
</button>
<button id="cat-cake" onclick="changeCategory('cake')" class="p-4 border-2 border-gray-200 rounded-xl text-left transition text-gray-800 font-medium text-sm hover:border-gray-300">
<span class="block text-xl">🎂</span> Cake & Bakery
</button>
<button id="cat-rent" onclick="changeCategory('rent')" class="p-4 border-2 border-gray-200 rounded-xl text-left transition text-gray-800 font-medium text-sm hover:border-gray-300">
<span class="block text-xl">🚗</span> Vehicle Rent / Taxi
</button>
<button id="cat-tourism" onclick="changeCategory('tourism')" class="p-4 border-2 border-gray-200 rounded-xl text-left transition text-gray-800 font-medium text-sm hover:border-gray-300">
<span class="block text-xl">🌴</span> Tourism / Safari
</button>
</div>
</div>

<div>
<label class="block text-sm font-semibold text-gray-700 mb-3">2. පෝස්ට් එකේ ප්‍රමාණය තෝරන්න (Aspect Ratio):</label>
<div class="grid grid-cols-4 gap-2">
<button id="ratio-1-1" onclick="changeRatio('1:1')" class="p-3 border-2 border-blue-500 bg-blue-50 text-blue-700 rounded-xl text-center text-xs font-bold">
1:1<br><span class="text-[10px] font-normal text-gray-500">Post</span>
</button>
<button id="ratio-9-16" onclick="changeRatio('9:16')" class="p-3 border-2 border-gray-200 rounded-xl text-center text-xs font-bold text-gray-700 hover:border-gray-300">
9:16<br><span class="text-[10px] font-normal text-gray-500">Story</span>
</button>
<button id="ratio-16-9" onclick="changeRatio('16:9')" class="p-3 border-2 border-gray-200 rounded-xl text-center text-xs font-bold text-gray-700 hover:border-gray-300">
16:9<br><span class="text-[10px] font-normal text-gray-500">Cover</span>
</button>
<button id="ratio-4-5" onclick="changeRatio('4:5')" class="p-3 border-2 border-gray-200 rounded-xl text-center text-xs font-bold text-gray-700 hover:border-gray-300">
4:5<br><span class="text-[10px] font-normal text-gray-500">Portrait</span>
</button>
</div>
</div>

<div>
<label class="block text-sm font-semibold text-gray-700 mb-2">3. පෝස්ට් එකේ සඳහන් විය යුතු දේ ලියන්න (Prompt):</label>
<textarea id="userPrompt" rows="4" placeholder="උදා: Big New Year Sale 20% Off! Valid until Sunday only." class="w-full p-3 border-2 border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm outline-none"></textarea>
</div>
</div>

<button onclick="renderTemplate()" class="w-full mt-6 bg-blue-600 hover:bg-blue-700 text-white font-semibold p-4 rounded-xl shadow-md transition text-center">
🎨 Design එක Preview කරන්න
</button>
</div>

<div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between items-center min-h-[400px]">
<h3 class="text-sm font-semibold text-gray-700 self-start mb-4">ඔබේ Design Preview එක:</h3>

<div id="previewContainer" class="w-full max-w-[320px] bg-gray-100 rounded-xl flex items-center justify-center border-2 border-dashed border-gray-300 aspect-square overflow-hidden shadow-inner p-2">
<p id="placeholderText" class="text-gray-400 text-xs text-center px-4">විස්තර ඇතුළත් කර Preview බටන් එක ඔබන්න.</p>
</div>

<button id="downloadBtn" onclick="triggerDownload()" class="w-full mt-6 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold p-3 rounded-xl shadow-sm transition hidden">
📥 Post එක Image (.png) එකක් ලෙස බාගත කරගන්න
</button>
</div>
</main>

<canvas id="hiddenCanvas" class="hidden"></canvas>

<footer class="bg-slate-900 text-slate-500 text-center py-4 text-xs border-t border-slate-800">
&copy; 2026 Lanka AI Design Agent. 100% Free Hosting.
</footer>

<script>
let selectedCategory = 'clothing';
let selectedRatio = '1:1';

function changeCategory(cat) {
selectedCategory = cat;
// Reset all buttons
document.querySelectorAll('[id^="cat-"]').forEach(btn => {
btn.className = "p-4 border-2 border-gray-200 rounded-xl text-left transition text-gray-800 font-medium text-sm hover:border-gray-300";
});
// Set active button
const activeBtn = document.getElementById('cat-' + cat);
activeBtn.className = "p-4 border-2 border-emerald-500 bg-emerald-50 rounded-xl text-left transition text-gray-800 font-medium text-sm";
}

function changeRatio(ratio) {
selectedRatio = ratio;
// Reset all buttons
document.querySelectorAll('[id^="ratio-"]').forEach(btn => {
btn.className = "p-3 border-2 border-gray-200 rounded-xl text-center text-xs font-bold text-gray-700 hover:border-gray-300";
});
// Set active button
const idMap = { '1:1': '1-1', '9:16': '9-16', '16:9': '16-9', '4:5': '4-5' };
const activeBtn = document.getElementById('ratio-' + idMap[ratio]);
activeBtn.className = "p-3 border-2 border-blue-500 bg-blue-50 text-blue-700 rounded-xl text-center text-xs font-bold";

// Adjust preview container wrapper style
const preview = document.getElementById('previewContainer');
preview.className = "w-full max-w-[320px] bg-gray-100 rounded-xl flex items-center justify-center border-2 border-dashed border-gray-300 overflow-hidden shadow-inner p-2";

if(ratio === '1:1') preview.classList.add('aspect-square');
if(ratio === '9:16') preview.classList.add('aspect-[9/16]');
if(ratio === '16:9') preview.classList.add('aspect-[16/9]');
if(ratio === '4:5') preview.classList.add('aspect-[4/5]');
}

function renderTemplate() {
const promptInput = document.getElementById('userPrompt').value || 'SPECIAL OFFER';
const container = document.getElementById('previewContainer');
const downloadBtn = document.getElementById('downloadBtn');

let width = 1080; let height = 1080;
if(selectedRatio === '9:16') { width = 1080; height = 1920; }
if(selectedRatio === '16:9') { width = 1920; height = 1080; }
if(selectedRatio === '4:5') { width = 1080; height = 1350; }

// Design Styles configurations
let color1 = "#2c3e50"; let color2 = "#0f2027";
let accentColor = "#f1c40f"; let tagLine = "FASHION & STYLE";

if(selectedCategory === 'cake') {
color1 = "#ff9ff3"; color2 = "#feca57"; accentColor = "#ffffff"; tagLine = "FRESH BAKED DAILY";
} else if(selectedCategory === 'rent') {
color1 = "#1e272e"; color2 = "#485460"; accentColor = "#ffa801"; tagLine = "RENT A CAR / TAXI";
} else if(selectedCategory === 'tourism') {
color1 = "#10ac84"; color2 = "#01a3a4"; accentColor = "#ff9f43"; tagLine = "EXPLORE SRI LANKA";
}

// Generate Raw SVG layout injection
const templateSvg = `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" width="100%" height="100%">
<defs>
<linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:${color1};stop-opacity:1" />
<stop offset="100%" style="stop-color:${color2};stop-opacity:1" />
</linearGradient>
</defs>
<rect width="100%" height="100%" fill="url(#canvasGrad)"/>
<circle cx="${width*0.8}" cy="${height*0.2}" r="${width*0.3}" fill="white" opacity="0.04"/>
<circle cx="${width*0.1}" cy="${height*0.8}" r="${width*0.2}" fill="${accentColor}" opacity="0.08"/>

<rect x="60" y="70" width="${width*0.45}" height="50" rx="10" fill="${accentColor}"/>
<text x="${60 + (width*0.225)}" y="96" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#111">${tagLine}</text>

<text x="60" y="${height*0.45}" font-family="Arial, sans-serif" font-size="${width*0.055}" font-weight="900" fill="white">${promptInput.substring(0, 30).toUpperCase()}</text>
<text x="60" y="${height*0.53}" font-family="Arial, sans-serif" font-size="${width*0.04}" font-weight="normal" fill="white" opacity="0.8">${promptInput.substring(30, 80) || ''}</text>

<rect x="60" y="${height*0.78}" width="${width*0.35}" height="60" rx="12" fill="white"/>
<text x="${60 + (width*0.175)}" y="${height*0.78 + 30}" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#111">CONTACT NOW</text>
</svg>
`;

container.innerHTML = templateSvg;
downloadBtn.classList.remove('hidden');
}

function triggerDownload() {
const svgElement = document.getElementById('previewContainer').querySelector('svg');
if(!svgElement) return;

const svgString = new XMLSerializer().serializeToString(svgElement);
const svgBlob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
const blobURL = URL.createObjectURL(svgBlob);

const image = new Image();
image.onload = () => {
let width = 1080; let height = 1080;
if(selectedRatio === '9:16') { width = 1080; height = 1920; }
if(selectedRatio === '16:9') { width = 1920; height = 1080; }
if(selectedRatio === '4:5') { width = 1080; height = 1350; }

const canvas = document.getElementById('hiddenCanvas');
canvas.width = width;
canvas.height = height;
const context = canvas.getContext("2d");
context.drawImage(image, 0, 0, width, height);

const pngURL = canvas.toDataURL("image/png");
const downloadLink = document.createElement("a");
downloadLink.href = pngURL;
downloadLink.download = `LankaAI_${selectedCategory}_${selectedRatio}.png`;
document.body.appendChild(downloadLink);
downloadLink.click();
document.body.removeChild(downloadLink);
URL.revokeObjectURL(blobURL);
};
image.src = blobURL;
}
</script>
</body>
</html>
