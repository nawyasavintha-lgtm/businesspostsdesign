<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lanka AI Design Agent PRO v3</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col justify-between">

<header class="bg-slate-900 text-white py-6 text-center shadow-sm">
<h1 class="text-2xl font-bold text-amber-400">Lanka AI Design Agent PRO</h1>
<p class="text-xs text-slate-400 mt-1">Multi-Image Gallery Support: એકસાથે અનેક રેફરન્સ પિંકચર્સ અપલોડ કરવાની સુવિધા</p>
</header>

<main class="max-w-5xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-2 gap-8 w-full flex-grow">
<div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm flex flex-col justify-between">
<div class="space-y-6">
<div>
<label class="block text-sm font-semibold text-gray-700 mb-2">1. બિસ્னಸ್ වර්ගය තෝරන්න:</label>
<select id="category" class="w-full p-3 border border-gray-300 rounded-xl text-sm bg-white outline-none">
<option value="clothing">👕 Clothing Business</option>
<option value="cake">🎂 Cake & Bakery</option>
<option value="rent">🚗 Rent & Taxi</option>
<option value="tourism">🌴 Tourism & Safari</option>
</select>
</div>

<div>
<label class="block text-sm font-semibold text-gray-700 mb-2">2. පෝස්ට් එකේ ප්‍රමාණය (Ratio):</label>
<select id="ratio" onchange="updatePreviewSize()" class="w-full p-3 border border-gray-300 rounded-xl text-sm bg-white outline-none">
<option value="1:1">1:1 (Square Post)</option>
<option value="9:16">9:16 (Story / Reel)</option>
<option value="16:9">16:9 (Landscape Cover)</option>
<option value="4:5">4:5 (Portrait Post)</option>
</select>
</div>

<div>
<label class="block text-sm font-semibold text-gray-700 mb-1">3. રેફરન્સ પિંકચર્સ અપલોડ કરો (Reference Images):</label>
<p class="text-[11px] text-gray-400 mb-2">તમે એક અથવા એકથી વધુ ગમે તેટલા પિંકચર્સ એકસાથે સિલેક્ટ કરી શકો છો (Multi-select)</p>
<input type="file" id="galleryImages" accept="image/*" multiple class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 border border-gray-300 p-2 rounded-xl" />
<div id="thumbsPreview" class="flex flex-wrap gap-2 mt-2"></div>
</div>

<div>
<label class="block text-sm font-semibold text-gray-700 mb-2">4. ඔබට අවශ්‍ය දේ ලියන්න (Prompt):</label>
<textarea id="userPrompt" rows="3" placeholder="உதா: Create a beautiful promotional social media banner using the uploaded images creatively..." class="w-full p-3 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
</div>
</div>

<button onclick="generateAIDesign()" id="genBtn" class="w-full mt-6 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-4 rounded-xl shadow-md transition text-sm">
✨ Real AI Design එක සාදන්න
</button>
</div>

<div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm flex flex-col justify-between items-center min-h-[400px]">
<h3 class="text-sm font-semibold text-gray-700 self-start mb-4">Live AI Preview:</h3>

<div id="previewContainer" class="w-full max-w-[300px] bg-gray-50 rounded-xl border-2 border-dashed border-gray-300 flex items-center justify-center overflow-hidden p-2 shadow-inner aspect-square transition-all">
<p id="placeholderText" class="text-gray-400 text-xs text-center px-6">විස්තර ඇතුළත් කර බටන් එක ඔබන්න.</p>
</div>

<button id="downloadBtn" onclick="downloadImage()" class="w-full mt-6 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl shadow-sm transition text-sm hidden">
📥 Post එක Image (.png) එකක් ලෙස බාගත කරගන්න
</button>
</div>
</main>

<canvas id="downloadCanvas" class="hidden"></canvas>

<script>
let uploadedImagesArray = [];

// Handle multi-image selection and preview thumbnails
document.getElementById('galleryImages').addEventListener('change', function(e) {
const files = e.target.files;
const thumbsContainer = document.getElementById('thumbsPreview');
thumbsContainer.innerHTML = ""; // reset
uploadedImagesArray = [];

if (files.length > 0) {
Array.from(files).forEach((file, index) => {
const reader = new FileReader();
reader.onload = function(event) {
const base64Str = event.target.result;
uploadedImagesArray.push(base64Str);

// Render small thumbnail for UI feedback
const img = document.createElement('img');
img.src = base64Str;
img.className = "w-12 h-12 object-cover rounded-lg border border-gray-300 shadow-sm";
thumbsContainer.appendChild(img);
};
reader.readAsDataURL(file);
});
}
});

function updatePreviewSize() {
const ratio = document.getElementById('ratio').value;
const preview = document.getElementById('previewContainer');
preview.className = "w-full max-w-[300px] bg-gray-50 rounded-xl border-2 border-dashed border-gray-300 flex items-center justify-center overflow-hidden p-2 shadow-inner transition-all";
if (ratio === '1:1') preview.classList.add('aspect-square');
if (ratio === '9:16') preview.classList.add('aspect-[9/16]');
if (ratio === '16:9') preview.classList.add('aspect-[16/9]');
if (ratio === '4:5') preview.classList.add('aspect-[4/5]');
}

async function generateAIDesign() {
const category = document.getElementById('category').value;
const ratio = document.getElementById('ratio').value;
const prompt = document.getElementById('userPrompt').value;
const btn = document.getElementById('genBtn');

if (!prompt) return alert("කරුණාකර පෝස්ට් එකේ වෙන්න ඕන දේ ලියන්න!");

btn.disabled = true;
btn.innerText = "⏳ AI මොඩලය මඟින් ඩිසයින් එක සාදමින් පවතී...";

try {
const res = await fetch('/.netlify/functions/generate', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({
category,
ratio,
prompt,
imageCount: uploadedImagesArray.length
})
});
const data = await res.json();

if (data.svg) {
let finalSvg = data.svg;

// Dynamically loop and replace placeholders {USER_IMAGE_0}, {USER_IMAGE_1}, etc.
uploadedImagesArray.forEach((base64Str, index) => {
const placeholder = new RegExp(`{USER_IMAGE_${index}}`, 'g');
finalSvg = finalSvg.replace(placeholder, base64Str);
});

document.getElementById('previewContainer').innerHTML = finalSvg;
document.getElementById('downloadBtn').classList.remove('hidden');
} else {
alert(data.error || "දෝෂයක් සිදු විය.");
}
} catch (err) {
alert("Backend එකට සම්බන්ධ වීමට නොහැකි විය.");
}
btn.disabled = false;
btn.innerText = "✨ Real AI Design එක සාදන්න";
}

function downloadImage() {
const svgElement = document.getElementById('previewContainer').querySelector('svg');
const ratio = document.getElementById('ratio').value;
const category = document.getElementById('category').value;
if (!svgElement) return;

const svgString = new XMLSerializer().serializeToString(svgElement);
const svgBlob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
const blobURL = URL.createObjectURL(svgBlob);

const image = new Image();
image.onload = () => {
let width = 1080; let height = 1080;
if (ratio === '9:16') { width = 1080; height = 1920; }
if (ratio === '16:9') { width = 1920; height = 1080; }
if (ratio === '4:5') { width = 1080; height = 1350; }

const canvas = document.getElementById('downloadCanvas');
canvas.width = width;
canvas.height = height;
const context = canvas.getContext("2d");
context.drawImage(image, 0, 0, width, height);

const pngURL = canvas.toDataURL("image/png");
const downloadLink = document.createElement("a");
downloadLink.href = pngURL;
downloadLink.download = `LankaAI_Pro_${category}_${ratio}.png`;
document.body.appendChild(downloadLink);
downloadLink.click();
document.body.removeChild(downloadLink);
URL.revokeObjectURL(blobURL);
};
image.src = blobURL;
}
</script>
</body>
</html>
